find_emerging_companies:
  description: >
    Find the top 5 emerging companies in the {topic} sector.
  expected_output: >
    A list of top 5 emerging companies in the {topic} sector.
  agent: emerging_companies_finder
  output_file: output/emerging_companies.json

research_emerging_companies:
  description: >
    Given a list of emerging companies, provide detailed analysis of each company in a report by searching online.
  expected_output: >
    A report containing detailed analysis of each emerging company.
  agent: financial_researcher
  context:
    - find_emerging_companies
  output_file: output/emerging_companies_research.json


pick_best_companies:
  description: >
    Given a list of emerging companies with investment potential, you select the best five(5) companies for investment,
    notifying the user and then providing a detailed report. Don't pick the same company twice. Send a push notification to the user with the decision and 1 sentence rationale.
  expected_output: >
    The chosen companies and why they were chosen; the companies that were not selected and why they were not selected.
  agent: stock_picker
  context:
    - research_emerging_companies
  output_file: output/decision.md

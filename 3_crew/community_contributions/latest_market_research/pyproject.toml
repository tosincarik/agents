[project]
name = "latest_market_research"
version = "0.1.0"
description = "latest_market_research using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.203.0,<1.0.0"
]

[project.scripts]
latest_market_research = "latest_market_research.main:run"
run_crew = "latest_market_research.main:run"
train = "latest_market_research.main:train"
replay = "latest_market_research.main:replay"
test = "latest_market_research.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

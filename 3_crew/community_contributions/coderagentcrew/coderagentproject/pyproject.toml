[project]
name = "coderagentproject"
version = "0.1.0"
description = "coderagentproject using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.203.0,<1.0.0"
]

[project.scripts]
coderagentproject = "coderagentproject.main:run"
run_crew = "coderagentproject.main:run"
train = "coderagentproject.main:train"
replay = "coderagentproject.main:replay"
test = "coderagentproject.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
